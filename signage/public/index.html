<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.documentElement.dataset.theme = localStorage.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
let token = localStorage.t || '', S = { media: [], playlists: [], screens: [], now: 0, at: 0 }, ed = null;
const T = {}; for (const k of ['screens', 'files', 'lists']) T[k] = { q: '', sort: k === 'screens' ? 'created' : k === 'files' ? 'created' : 'created', per: 15, page: 1, sel: new Set(), cur: [], ft: new Set() };

async function api(p, o = {}) {
  const r = await fetch('/api/' + p, { ...o, headers: { ...o.headers, authorization: 'Bearer ' + token } });
  if (r.status === 401 && p !== 'login') { token = ''; localStorage.t = ''; showLogin(); throw new Error('login'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Erro ' + r.status);
  return j;
}
const send = (p, method, body) => api(p, { method, headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
const load = async () => { S = { ...(await api('state')), at: Date.now() }; };
const toast = m => alert(m);
const guard = fn => async (...a) => { try { await fn(...a); } catch (e) { if (e.message !== 'login') toast(e.message); } };

/* ---------- helpers ---------- */
const nowMs = () => S.now + (Date.now() - S.at);
const DAYS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const inSched = (s, d = new Date()) => { const x = s.schedule; if (!x?.days?.length) return true;
  const hm = t => +t.slice(0, 2) * 60 + +t.slice(3), m = d.getHours() * 60 + d.getMinutes(), a = hm(x.start), b = hm(x.end), day = d.getDay(), prev = (day + 6) % 7;
  if (a === b) return x.days.includes(day);
  return a < b ? x.days.includes(day) && m >= a && m < b : (x.days.includes(day) && m >= a) || (x.days.includes(prev) && m < b); };
const schedTxt = s => { const x = s.schedule; if (!x?.days?.length) return 'Sempre'; return `${x.days.length === 7 ? 'Todos os dias' : [...x.days].sort().map(i => DAYS[i]).join(', ')} · ${x.start}–${x.end}`; };
const stOf = s => { const d = s.seen ? nowMs() - s.seen : Infinity; return d < 45000 ? 'ok' : d < 180000 ? 'warn' : inSched(s) ? 'bad' : 'off'; };

function listPage(key, title, btn, extra = '') {

function renderTbl(key) {

  const a = (t.page - 1) * t.per, sl = rows.slice(a, a + t.per); t.cur = sl.map(r => r.id);
  for (const id of [...t.sel]) if (!v.rows().some(r => r.id === id)) t.sel.delete(id);

}
const selOne = (k, id, on) => { on ? T[k].sel.add(id) : T[k].sel.delete(id); renderTbl(k); };

const saveTag = guard(async (id, key, name, color) => { await send('tags', 'POST', { id, name, color }); await refreshTags(key); });

const POS = [['50,50', 'Centro'], ['50,0', 'Topo'], ['50,100', 'Base'], ['0,50', 'Esquerda'], ['100,50', 'Direita'], ['0,0', 'Topo à esquerda'], ['100,0', 'Topo à direita'], ['0,100', 'Base à esquerda'], ['100,100', 'Base à direita']];
const wsum = it => it.kind === 'clock' ? 'Relógio e data' : it.kind === 'weather' ? 'Clima — ' + (it.cfg.city || '?') : 'Notícias (' + (it.cfg.mode === 'slides' ? 'slides' : 'faixa rolando') + ')';
function zRow(o, i, z) { // uma zona: o que mostra (lista, arquivo ou widget), giro e ajuste

    ext = `<div class="zx"><label>Zoom <input type="number" min="20" max="400" step="10" value="${c.zoom}" style="width:72px" onchange="zView('${o}',${i},'zoom',this.value)"> %</label><label>Posição <select onchange="zView('${o}',${i},'pos',this.value)">${POS.map(([v, n]) => so(v, n, c.ax + ',' + c.ay)).join('')}</select></label><span class="mut">Imagem: fica parada. Vídeo: repete sem parar.</span></div>`; }
  else { const k = c.item.kind; mid = `<select onchange="zWid('${o}',${i},this.value)">${so('clock', 'Relógio e data', k)}${so('weather', 'Clima', k)}${so('news', 'Notícias', k)}</select>${k !== 'clock' ? `<button onclick="zWidCfg('${o}',${i})">Configurar</button>` : ''}`; ext = `<div class="zx mut">${esc(wsum(c.item))}</div>`; }
  return `<div class="zrow2"><div class="zr1"><i style="background:${col}"></i><b>Zona ${i + 1}</b><select title="O que esta zona mostra" onchange="zType('${o}',${i},this.value)">${so('list', 'Lista de reprodução', t)}${so('file', 'Arquivo', t)}${so('widget', 'Widget', t)}</select>${mid}<select title="Girar o conteúdo desta zona" onchange="zSet('${o}',${i},'rot',this.value)">${rotOpts(z.rot)}</select><select title="Ajuste da mídia na zona" onchange="zSet('${o}',${i},'fit',this.value)"><option value="">Ajuste da tela</option>${FIT.map(([v, n]) => `<option value="${v}" ${z.fit === v ? 'selected' : ''}>${n}</option>`).join('')}</select><button class="d" onclick="zDel('${o}',${i})">Remover</button></div>${ext}</div>`;
}
function zType(o, i, t) { ZE[o].zones[i].content = t === 'list' ? null : t === 'file' ? { type: 'file', mediaId: (S.media[0] || {}).id || '', zoom: 100, ax: 50, ay: 50 } : { type: 'widget', item: { kind: 'clock', seconds: 15 } }; zLater(); }

const zFile = (o, i, v) => { ZE[o].zones[i].content.mediaId = v; zLater(); };
function zView(o, i, k, v) { const c = ZE[o].zones[i].content; if (k === 'pos') { const p = v.split(',').map(Number); c.ax = p[0]; c.ay = p[1]; } else c.zoom = Math.max(20, Math.min(400, +v || 100)); zLater(); }
function zWid(o, i, k) { const z = ZE[o].zones[i]; if (z.content.item.kind === k) return; z.content.item = k === 'clock' ? { kind: 'clock', seconds: 15 } : { kind: k, seconds: 15, cfg: JSON.parse(JSON.stringify(WDEF[k])) }; zLater(); if (k !== 'clock') setTimeout(() => zWidCfg(o, i), 10); }
function zWidCfg(o, i) { const it = ZE[o].zones[i].content.item; WM = { zone: { o, i }, id: '', k: -1, kind: it.kind, seconds: it.seconds, cfg: { ...WDEF[it.kind], ...JSON.parse(JSON.stringify(it.cfg || {})) }, res: [] }; wOpen(); }
const zSet = (o, i, k, v) => { ZE[o].zones[i][k] = k === 'rot' ? +v : v; if (k === 'playlistId') zLater(); };
function zAdd(o) { const g = ZE[o]; if (g.zones.length >= 20) return toast('Máximo de 20 zonas'); const w = Math.max(1, Math.round(g.cols / 3)), h = Math.max(1, Math.round(g.rows / 3)), n = g.zones.length % 4;
  g.zones.push({ x: Math.min(g.cols - w, Math.floor((g.cols - w) / 2) + n), y: Math.min(g.rows - h, Math.floor((g.rows - h) / 2) + n), w, h, playlistId: null, rot: 0, fit: '' }); zDraw(); }
const zDel = (o, i) => { ZE[o].zones.splice(i, 1); zDraw(); };
function zGrid(o, k, v) { const g = ZE[o], n = Math.min(48, Math.max(4, parseInt(v) || g[k])), f = n / g[k], a = k === 'cols' ? ['x', 'w'] : ['y', 'h'];

  const g = ZE[o], r = zn.parentElement.getBoundingClientRect();
  ZD = { o, i, mode: act === 'rs' ? 'rs' : 'mv', x: e.clientX, y: e.clientY, cw: r.width / g.cols, ch: r.height / g.rows, z0: { ...g.zones[i] } };

}

  if (!ZD) return; const g = ZE[ZD.o], z = g.zones[ZD.i], z0 = ZD.z0, dx = Math.round((e.clientX - ZD.x) / ZD.cw), dy = Math.round((e.clientY - ZD.y) / ZD.ch), cl = (v, a, b) => Math.max(a, Math.min(b, v));
  if (ZD.mode === 'mv') { z.x = cl(z0.x + dx, 0, g.cols - z.w); z.y = cl(z0.y + dy, 0, g.rows - z.h); } else { z.w = cl(z0.w + dx, 1, g.cols - z.x); z.h = cl(z0.h + dy, 1, g.rows - z.y); }
  const el = document.querySelector(`.zn[data-o="${ZD.o}"][data-i="${ZD.i}"]`); if (!el) return;
  el.style.left = z.x / g.cols * 100 + '%'; el.style.top = z.y / g.rows * 100 + '%'; el.style.width = z.w / g.cols * 100 + '%'; el.style.height = z.h / g.rows * 100 + '%';

const zUp = () => { ZD = null; };
const zSave = guard(async () => {

  if (!ZE.id) location.hash = '#/zonas/' + r.id; else { ZE = JSON.parse(JSON.stringify(S.layouts.find(l => l.id === ZE.id) || ZE)); zDraw(); }
});

/* ---------- rotas ---------- */
function route() {

  document.querySelectorAll('.side nav a').forEach(a => a.classList.toggle('on', a.dataset.r === r));
  sideStatus(); if (r !== 'listas' || !id) ed = null;

setInterval(async () => { if (!token || dlg.open || !$('#page')) return; try { await load(); } catch { return; } sideStatus();
  const h = location.hash; if (h.includes('status')) pStatus(); else if (/^#?\/?(inicio)?$/.test(h)) pInicio(); else if (h.includes('telas') && $('#tbl')) renderTbl('screens'); }, 10000);
